<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>System Monitor</title>
<style>
*{box-sizing:border-box}body{margin:0;background:var(--remotehand-background,#10151b);color:var(--remotehand-text,#dce4ee);font:14px var(--remotehand-ui-font-family,system-ui,sans-serif)}.shell{width:100%;max-width:none;margin:0;padding:12px 10px 18px}.header{display:flex;align-items:center;gap:14px;margin-bottom:14px}.header h1{font-size:20px;margin:0}.badge{font-size:11px;padding:3px 8px;border:1px solid var(--remotehand-border,#2b3642);border-radius:999px;color:var(--remotehand-success-text,#72d59a)}.tabs{display:flex;gap:4px;border-bottom:1px solid var(--remotehand-border,#2b3642);margin-bottom:16px}.tab{border:0;background:transparent;color:var(--remotehand-muted-text,#8f9baa);padding:10px 14px;border-bottom:2px solid transparent;border-radius:0;cursor:pointer}.tab.active{color:var(--remotehand-text,#dce4ee);border-bottom-color:var(--remotehand-accent,#579ce7)}main{display:block}.panel{display:none}.panel.active{display:grid;gap:12px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.spacer{flex:1}button,select,input{font:inherit}button,select{background:var(--remotehand-button-background,#202a35);color:inherit;border:1px solid var(--remotehand-border,#344252);border-radius:7px;padding:7px 10px}.graphs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:var(--remotehand-surface,#161d25);border:1px solid var(--remotehand-border,#2b3642);border-radius:10px;padding:12px;min-width:0}.card h2{font-size:13px;margin:0 0 8px}.value{font-size:28px;font-weight:650}.sub{font-size:12px;color:var(--remotehand-muted-text,#8f9baa);min-height:18px}canvas{width:100%;height:110px;background:rgba(255,255,255,.02);border-radius:6px}.cores{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:7px}.core{border:1px solid var(--remotehand-border,#2b3642);padding:8px;border-radius:6px;min-width:0}.bar{height:5px;margin-top:5px;background:#ffffff14;border-radius:5px;overflow:hidden}.bar span{display:block;height:100%;background:var(--remotehand-accent,#579ce7)}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:880px}th,td{padding:8px;border-bottom:1px solid var(--remotehand-border,#293440);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}th{font-size:11px;color:var(--remotehand-muted-text,#8f9baa)}.settings-card{max-width:none}.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}.metricbox{border:1px solid var(--remotehand-border,#344252);padding:10px;border-radius:8px;display:grid;gap:8px}.metricbox h3{margin:0}.check{display:flex;gap:6px;align-items:center}.field{display:grid;gap:4px}.field input{background:var(--remotehand-input-background,#111820);color:inherit;border:1px solid var(--remotehand-border,#344252);border-radius:5px;padding:6px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.notice{position:fixed;right:15px;bottom:15px;padding:9px 11px;border-radius:7px;background:var(--remotehand-surface-raised,#1b242e);border:1px solid var(--remotehand-border,#344252);display:none}@media(max-width:850px){.graphs{grid-template-columns:1fr}.settings-grid{grid-template-columns:1fr}.cores{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}}
</style></head>
<body><div class="shell">
<div class="header"><h1>System Monitor</h1><span id="runtime" class="badge">STARTING</span></div>
<div class="tabs"><button class="tab active" data-tab="overview">Overview</button><button class="tab" data-tab="settings">Settings</button></div>
<main>
<section id="overviewPanel" class="panel active">
<div class="toolbar"><label>History <select id="window"><option value="5">5 min</option><option value="15" selected>15 min</option><option value="30">30 min</option><option value="60">1 hour</option></select></label><div class="spacer"></div><button id="export">Export CSV</button></div>
<div class="graphs">
<div class="card"><h2>CPU Utilization</h2><div class="value" id="cpu">—</div><canvas id="cpuGraph" width="500" height="110"></canvas></div>
<div class="card"><h2>Memory</h2><div class="value" id="mem">—</div><div class="sub" id="memBytes">—</div><canvas id="memGraph" width="500" height="110"></canvas></div>
</div>
<div class="card"><h2>Per-core activity</h2><div id="cores" class="cores"></div></div>
<div class="card"><h2>Metrics</h2><div class="table-wrap"><table><thead><tr><th>Metric</th><th>Current</th><th>Min</th><th>Average</th><th>Peak</th><th>Healthy</th><th>Critical</th><th>Capacity</th></tr></thead><tbody id="metrics"></tbody></table></div></div>
</section>
<section id="settingsPanel" class="panel">
<div class="card settings-card"><h2>Settings</h2><div class="field"><label>Sample interval (seconds)</label><input id="sampleSeconds" type="number" min="1" max="30"></div><div id="settingsGrid" class="settings-grid"></div><div class="actions"><button id="saveSettings">Save Settings</button></div></div>
</section>
</main>
<div id="notice" class="notice"></div>
<script>
(function(){"use strict";
var bridge=window.remotehand,state={config:null,latest:null,history:[]},minutes=15,chain=Promise.resolve();
function el(id){return document.getElementById(id)}function request(method,params){params=params||{};if(!bridge||!bridge.request)return Promise.reject(new Error("plugin bridge unavailable"));var run=function(){return bridge.request(method,params)};var p=chain.then(run,run);chain=p.catch(function(){});return p}
function fmt(v,u){return v!==null&&v!==undefined&&v!==""&&Number.isFinite(Number(v))?Math.round(Number(v))+u:"—"}function bytes(v){if(v==null)return"—";var n=Number(v),u=["B","KB","MB","GB","TB"],i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return n.toFixed(i>=3?1:0)+" "+u[i]}
function toast(t){var n=el("notice");n.textContent=t;n.style.display="block";clearTimeout(n.t);n.t=setTimeout(function(){n.style.display="none"},2500)}
function recent(){var c=Date.now()-minutes*60000;return(state.history||[]).filter(function(s){return Number(s.timestamp)>=c})}
function stats(a){a=a.filter(function(v){return Number.isFinite(v)});if(!a.length)return null;var min=Math.min.apply(null,a),max=Math.max.apply(null,a),sum=a.reduce(function(x,y){return x+y},0);return{min:min,max:max,avg:sum/a.length}}
function draw(id,vals,temp){var c=el(id),x=c.getContext("2d"),w=c.width,h=c.height;x.clearRect(0,0,w,h);x.strokeStyle="rgba(150,165,180,.18)";for(var g=1;g<4;g++){x.beginPath();x.moveTo(0,g*h/4);x.lineTo(w,g*h/4);x.stroke()}if(vals.length<2)return;var good=vals.filter(function(v){return Number.isFinite(v)});if(!good.length)return;var lo=temp?Math.min.apply(null,[20].concat(good)):0,hi=temp?Math.max.apply(null,[100].concat(good)):100;x.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue("--remotehand-accent").trim()||"#579ce7";x.lineWidth=2;x.beginPath();var started=false;vals.forEach(function(v,i){if(!Number.isFinite(v))return;var px=i/Math.max(1,vals.length-1)*w,py=h-(v-lo)/(hi-lo||1)*h;if(!started){x.moveTo(px,py);started=true}else x.lineTo(px,py)});x.stroke()}
function render(){var l=state.latest,h=recent();el("runtime").textContent=l?"LIVE":"WAITING";el("cpu").textContent=l?fmt(l.cpuPercent,"%"):"—";el("mem").textContent=l?fmt(l.memoryPercent,"%"):"—";el("memBytes").textContent=l?bytes(l.memoryUsedBytes)+" / "+bytes(l.memoryTotalBytes)+" · "+bytes(l.memoryAvailableBytes)+" available":"—";
draw("cpuGraph",h.map(function(s){return Number(s.cpuPercent)}),false);draw("memGraph",h.map(function(s){return Number(s.memoryPercent)}),false);
var cg=el("cores");cg.innerHTML="";(l&&l.corePercent||[]).forEach(function(v,i){var d=document.createElement("div");d.className="core";var line=document.createElement("div");line.textContent="Core "+(i+1)+"  "+fmt(v,"%");var bar=document.createElement("div");bar.className="bar";var fill=document.createElement("span");fill.style.width=Math.max(0,Math.min(100,v))+"%";bar.appendChild(fill);d.appendChild(line);d.appendChild(bar);cg.appendChild(d)});
var total=l&&Number(l.memoryTotalBytes),cpuCfg=state.config&&state.config.cpu,memCfg=state.config&&state.config.memory;
var defs=[
["CPU Utilization",l&&l.cpuPercent,h.map(function(s){return Number(s.cpuPercent)}),"%",cpuCfg&&cpuCfg.healthyMax,cpuCfg&&cpuCfg.criticalMin,100],
["Memory Utilization",l&&l.memoryPercent,h.map(function(s){return Number(s.memoryPercent)}),"%",memCfg&&memCfg.healthyMax,memCfg&&memCfg.criticalMin,100],
["Memory Used",l&&l.memoryUsedBytes,h.map(function(s){return Number(s.memoryUsedBytes)}),"bytes",total&&memCfg?total*Number(memCfg.healthyMax)/100:null,total&&memCfg?total*Number(memCfg.criticalMin)/100:null,total]
];var body=el("metrics");body.innerHTML="";defs.forEach(function(r){var st=stats(r[2]),tr=document.createElement("tr"),vals=[r[0],r[1],st&&st.min,st&&st.avg,st&&st.max,r[4],r[5],r[6]];vals.forEach(function(v,j){var td=document.createElement("td");if(j===0)td.textContent=v;else if(j===5)td.textContent=v==null?"—":"≤ "+(r[3]==="bytes"?bytes(v):fmt(v,r[3]));else if(j===6)td.textContent=v==null?"—":"≥ "+(r[3]==="bytes"?bytes(v):fmt(v,r[3]));else td.textContent=r[3]==="bytes"?bytes(v):fmt(v,r[3]);tr.appendChild(td)});body.appendChild(tr)})}
function metricBox(key,title){var c=state.config[key],box=document.createElement("div");box.className="metricbox";box.innerHTML="<h3>"+title+"</h3>";function check(field,label){var x=document.createElement("label");x.className="check";var i=document.createElement("input");i.type="checkbox";i.checked=!!c[field];i.dataset.key=key;i.dataset.field=field;x.appendChild(i);x.appendChild(document.createTextNode(label));box.appendChild(x)}function number(field,label){var d=document.createElement("label");d.className="field";d.textContent=label;var i=document.createElement("input");i.type="number";i.value=c[field];i.dataset.key=key;i.dataset.field=field;d.appendChild(i);box.appendChild(d)}check("showTopbar","Show in top bar");check("showTray","Show in system tray");check("sound","Sound");check("notification","Notification");number("healthyMax","Healthy maximum");number("criticalMin","Critical minimum");var test=document.createElement("button");test.textContent="Test alert";test.onclick=function(){request("system.alert.test",{metric:key}).then(function(){toast("Alert test sent")}).catch(function(e){toast(String(e))})};box.appendChild(test);return box}
function renderSettings(){if(!state.config)return;el("sampleSeconds").value=state.config.sampleSeconds;var g=el("settingsGrid");g.innerHTML="";g.appendChild(metricBox("cpu","CPU utilization"));g.appendChild(metricBox("memory","Memory utilization"))}
function saveSettings(){var c=JSON.parse(JSON.stringify(state.config));c.sampleSeconds=Math.max(1,Math.min(30,Number(el("sampleSeconds").value)||2));el("settingsGrid").querySelectorAll("[data-key]").forEach(function(i){c[i.dataset.key][i.dataset.field]=i.type==="checkbox"?i.checked:Number(i.value)});request("system.config.set",c).then(function(v){state=v;render();renderSettings();toast("Settings saved")}).catch(function(e){toast(String(e))})}
function refresh(){request("system.status").then(function(v){state=v;render()}).catch(function(e){el("runtime").textContent="ERROR";toast(String(e))})}
el("window").onchange=function(){minutes=Number(this.value);render()};el("export").onclick=function(){var d=new Date(),stamp=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")+"-"+String(d.getHours()).padStart(2,"0")+String(d.getMinutes()).padStart(2,"0");request("system.export.csv",{minutes:minutes,suggestedName:"system-monitor-history-"+stamp+".csv"}).then(function(){toast("CSV saved")}).catch(function(e){toast(String(e))})};el("saveSettings").onclick=saveSettings;document.querySelectorAll(".tab").forEach(function(tab){tab.onclick=function(){var name=tab.dataset.tab;document.querySelectorAll(".tab").forEach(function(t){t.classList.toggle("active",t===tab)});document.querySelectorAll(".panel").forEach(function(p){p.classList.toggle("active",p.id===name+"Panel")});if(name==="settings")renderSettings()}});
if(bridge&&bridge.onEvent){bridge.onEvent("system.ready",refresh);bridge.onEvent("system.sampled",function(s){state.latest=s;state.history=state.history||[];state.history.push(s);var c=Date.now()-3600000;state.history=state.history.filter(function(x){return Number(x.timestamp)>=c});render()});bridge.onEvent("system.alert",function(p){toast(p.title+": "+p.state)})}
refresh();setInterval(function(){if(document.visibilityState!=="hidden")refresh()},10000);
})();
</script></div></body></html>
