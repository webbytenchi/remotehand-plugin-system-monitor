<body><div class="shell">
<div class="header"><h1>System Monitor</h1><span id="runtime" class="badge">STARTING</span></div>
<div class="tabs"><button class="tab active" data-tab="overview">Overview</button><button class="tab" data-tab="settings">Settings</button></div>
<main>
<section id="overviewPanel" class="panel active">
<div class="toolbar"><label>History <select id="window"><option value="5">5 min</option><option value="15" selected>15 min</option><option value="30">30 min</option><option value="60">1 hour</option></select></label><div class="spacer"></div><button id="export">Export CSV</button></div>
<div class="graphs">
<div class="card" id="cpuCard"><h2>CPU Utilization</h2><div class="value metric-state" id="cpu">—</div><canvas id="cpuGraph" width="500" height="110"></canvas><div id="cpuBar" class="overview-bar" hidden><div class="overview-bar-track"><span id="cpuBarFill" class="overview-bar-fill"></span></div></div></div>
<div class="card" id="memCard"><h2>Memory</h2><div class="value metric-state" id="mem">—</div><div class="sub" id="memBytes">—</div><canvas id="memGraph" width="500" height="110"></canvas><div id="memBar" class="overview-bar" hidden><div class="overview-bar-track"><span id="memBarFill" class="overview-bar-fill"></span></div></div></div>
</div>
<div class="card"><h2>GPUs</h2><div id="gpuList" class="gpu-list"><div class="sub">Detecting GPUs…</div></div></div>
<div class="card"><h2>Per-core activity</h2><div id="cores" class="cores"></div></div>
<div class="card"><h2>Metrics</h2><div class="table-wrap"><table><thead><tr><th>Metric</th><th>Current</th><th>Min</th><th>Average</th><th>Peak</th><th>Healthy</th><th>Critical</th><th>Capacity</th></tr></thead><tbody id="metrics"></tbody></table></div></div>
</section>
<section id="settingsPanel" class="panel">
<div class="card settings-card"><h2>Settings</h2><div id="settingsTabs" class="settings-tabs"></div><div id="settingsContent"></div><div class="actions"><button id="saveSettings">Save Settings</button></div></div>
</section>
</main>
<div id="notice" class="notice" hidden><span id="noticeText" class="notice-text"></span><button id="noticeClose" class="notice-close" type="button" aria-label="Dismiss message">×</button></div>

host.appendChild(wrap)})}
